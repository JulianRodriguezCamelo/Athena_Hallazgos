name: Uptime Monitor

on:
  schedule:
    - cron: '*/15 * * * *'  # Cada 15 minutos
  workflow_dispatch:

jobs:
  check:
    name: Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Check backend health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            "${{ secrets.APP_URL }}/api/monitoring/health" || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Backend health check failed with status $STATUS"
            exit 1
          fi
          echo "Backend OK ($STATUS)"

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "🚨 *Hallazgos ERO* — El servicio está caído\nStatus: failure\nURL: ${{ secrets.APP_URL }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
