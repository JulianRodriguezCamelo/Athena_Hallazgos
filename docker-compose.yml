version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: hallazgos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hallazgos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hallazgos_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: hallazgos_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    environment:
      FLASK_ENV: development
      SECRET_KEY: hallazgos-secret-key-2025-fiduprevisora
      JWT_SECRET_KEY: jwt-hallazgos-secret-2025
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: hallazgos_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      CORS_ORIGINS: http://localhost:3000
      MAIL_SERVER: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USE_TLS: "true"
      MAIL_USERNAME: iaciberseguridad1@gmail.com
      MAIL_PASSWORD: tqvh ltra vsco lmwz
      MAIL_DEFAULT_SENDER: iaciberseguridad1@gmail.com
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: hallazgos_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
